# Weekly AAII sentiment sync (free GitHub Actions egress; no residential proxy).
# AAII blocks AWS/datacenter IPs (Imperva). Runners typically reach aaii.com.
# Committed files are pulled on the server via fetch_aaii_spread() GitHub raw fallback or git pull.
name: Sync AAII Sentiment

on:
  schedule:
    # Thu 14:00 UTC ≈ 9am ET after AAII Thursday release; Fri backup
    - cron: "0 14 * * 4"
    - cron: "0 14 * * 5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-aaii:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas xlrd beautifulsoup4 lxml requests curl_cffi

      - name: Fetch AAII sentiment
        run: python scripts/fetch_aaii_sentiment_sync.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add macro_intelligence/data/aaii_sentiment.xls macro_intelligence/data/aaii_sentiment.csv
          if git diff --cached --quiet; then
            echo "No AAII data changes"
          else
            git commit -m "chore(data): sync AAII sentiment $(date -u +'%Y-%m-%d')"
            git push
          fi
