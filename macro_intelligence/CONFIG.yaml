# Runic Agent v2.2 — Macro Intelligence Agent configuration
version: "2.2"

claude:
  model: "claude-sonnet-4-5-20250929"  # fallback; spec prefers claude-sonnet-4-6 when available
  regime_max_tokens: 150
  narrative_max_tokens: 2200

schedules:
  friday_pull_cron: "0 18 * * 5"   # Friday 6pm UTC (~after CFTC 3:30pm ET)
  nightly_cron: "0 21 * * 1-5"     # Mon-Fri 21:00 ET — set TZ on host
  monthly_review_cron: "0 10 1 * *"  # first day of month

prefilter:
  min_historical_fires: 3
  min_hit_rate: 0.60
  candidate_named_min_fires: 3
  candidate_named_min_hit_rate: 0.75

combo_discovery:
  primary_horizon: spx_3m
  surface_min_fires: 3
  surface_min_hit_rate: 0.60
  promotion_min_fires: 5
  promotion_min_hit_rate: 0.80
  beta_min_hit_rate: 0.55
  beta_min_hit_rate_alt: 0.60
  directionality_min_dims: 2
  directionality_min_hit_rate: 0.50
  hostile_fed_cycles: [HIKING_EARLY, HIKING_LATE, TIGHTENING]
  hostile_curve_regimes: [INVERTED]

forward_returns:
  spx_ticker: "^GSPC"
  horizons_trading_days: [5, 21, 63, 126]

variables:
  - id: NFCI
    name: "Financial Conditions (NFCI)"
    source: "FRED"
    ticker: "NFCI"
    paradigm: DUAL
    pctile_window: full
    pctile_start: "1973-01-01"
    combos: [A, E]
    rare:
      high_pctile: 80
      low_pctile: 20
      high_sd: 0.3
      low_sd: -0.3
    extreme:
      high_pctile: 95
      low_pctile: 5
      high_sd: 0.8
      low_sd: -0.8
  - id: HY
    name: "HY Credit Spreads OAS"
    source: "FRED"
    ticker: "BAMLH0A0HYM2"
    paradigm: DUAL
    pctile_window: rolling_3y
    pctile_start: "1996-01-01"
    combos: [A, B, F, G]
    rare:
      abs_bps: 400
      high_pctile: 80
    extreme:
      abs_bps: 500
      high_pctile: 95
  - id: WALCL
    name: "Fed Balance Sheet MoM"
    source: "FRED"
    ticker: "WALCL"
    paradigm: ROC
    pctile_window: full
    pctile_start: "2008-01-01"
    combos: [A, C]
    rare:
      mom_pct: 0.8
    extreme:
      mom_pct: 2.0
  - id: CNH
    name: "USD/CNH 4wk change"
    source: "YAHOO"
    ticker: "USDCNH=X"
    fallback: "FRED:DEXCHUS"
    paradigm: ROC
    pctile_window: rolling_3y
    pctile_start: "2010-01-01"
    combos: [A, C, G]
    rare:
      pct_4wk: 1.5
    extreme:
      pct_4wk: 3.5
  - id: WTI
    name: "WTI Oil 4wk change"
    source: "YAHOO"
    ticker: "CL=F"
    paradigm: ROC
    pctile_window: rolling_3y
    combos: [C]
    rare:
      pct_4wk: 6.0
    extreme:
      pct_4wk: 10.0
  - id: VIX
    name: "VIX Level"
    source: "YAHOO"
    ticker: "^VIX"
    paradigm: DUAL
    pctile_window: rolling_3y
    pctile_start: "1990-01-01"
    combos: [B, D, G]
    rare:
      abs_level: 25
      high_pctile: 80
      # T-03 fix (2026-06-06 audit): a single-day % jump this large is historically significant
      # stress even when the absolute level (e.g. 21.51 post-jump) is still below abs_level.
      single_day_pct_change: 0.25
    extreme:
      abs_level: 35
      high_pctile: 95
      single_day_pct_change: 0.40
  - id: VXTS
    name: "VIX Term Structure"
    source: "YAHOO"
    ticker_ratio: ["^VIX3M", "^VIX"]
    paradigm: RATIO
    pctile_window: rolling_3y
    pctile_start: "2007-01-01"
    combos: [D, G]
    rare:
      low_ratio: 0.95
      high_ratio: 1.10
    extreme:
      low_ratio: 0.85
      high_ratio: 1.20
  - id: CFTC
    name: "CFTC Net Spec (Fast Money)"
    source: "CFTC"
    paradigm: PCTILE
    pctile_window: rolling_3y
    pctile_start: "2006-01-01"
    combos: [B, D, E, F]
    rare:
      low_pctile: 15
      high_pctile: 85
    extreme:
      low_pctile: 5
      high_pctile: 95
  - id: CURVE
    name: "10Y-2Y Yield Curve"
    source: "FRED"
    ticker: "T10Y2Y"
    paradigm: DUAL
    pctile_window: full
    pctile_start: "1976-01-01"
    combos: [A, E]
    rare:
      spread_bps: -30
      steepen_4wk_bps: 15
    extreme:
      spread_bps: -80
      steepen_4wk_bps: 40
  - id: CPI
    name: "CPI Surprise"
    source: "CPI"
    paradigm: ABS
    pctile_window: rolling_3y
    combos: [C]
    rare:
      surprise_pp: 0.2
    extreme:
      surprise_pp: 0.4
  - id: GSR
    name: "Gold/Silver Ratio 4wk change"
    source: "YAHOO"
    ticker_ratio: ["GC=F", "SI=F"]
    paradigm: ROC
    pctile_window: rolling_3y
    combos: [A]
    rare:
      pct_4wk: 5.0
    extreme:
      pct_4wk: 8.0
  - id: CAPE
    name: "CAPE / Shiller P/E"
    source: "CAPE"
    paradigm: ABS
    pctile_window: full
    pctile_start: "1881-01-01"
    combos: [E]
    rare:
      high_level: 28
      low_level: 16
    extreme:
      high_level: 32
      low_level: 12

named_combos:
  A:
    min_of_four: 2
    vars: [NFCI, HY, WALCL, CNH]
  B:
    all_required: [VIX, HY, CFTC]
    vix_min: 25
    hy_bps_min: 400
    cftc_max_pctile: 15
  C:
    wti_4wk_min: 10.0
    cpi_surprise_min: 0.2
    walcl_flat: true
  D:
    # BEST PRODUCTION SCORE (n=46): VXTS≥1.18 / CFTC≥95 / VIX≤13 / 2-of-3
    # Validated primary horizon: 1W (also report 2W). See de_threshold_test_analysis.md
    min_of_three: 2
    vxts_min: 1.18
    cftc_min_pctile: 95
    vix_max: 13
  E:
    # BEST PRODUCTION SCORE (n≥10): CAPE≥32 / NFCI≤−0.15 / CFTC≥85 / 3-of-3
    # CFTC escalation alert when FM pctile rises during an active E episode
    # (NFCI tighter than −0.15 moves needle less than CFTC crowding — Rohit 2026-07-17)
    min_of_three: 3
    cape_min: 32
    nfci_easy_max: -0.15
    cftc_min_pctile: 85
    cftc_escalation_alert: true
    cftc_escalation_lookback_weeks: 4
    cftc_escalation_min_pctile_rise: 5
  F:
    spx_50wma_reclaim_weekly_pct: 3.0
    cftc_max_pctile: 50
    active_weeks: 26
  G:
    vxts_max: 1.0
    hy_widen_4wk_bps: 30
    vix_max: 20

persistence_rules:
  - name: 7WK_GRIND
    variable: SPX
    condition: "weekly_return_gt"
    value: 0.5
    periods: 7
    period_unit: weeks
  - name: 3WK_SURGE
    variable: SPX
    condition: "weekly_return_gte"
    value: 3.0
    periods: 3
    period_unit: weeks
  - name: VIX_SUPPRESSED
    variable: VIX
    condition: "below"
    value: 15
    periods: 10
    period_unit: trading_days
  - name: HY_GRIND_TIGHT
    variable: HY
    condition: "tightening_4wk"
    periods: 8
    period_unit: weeks
  - name: FCI_EASING_STREAK
    variable: NFCI
    condition: "improving"
    periods: 6
    period_unit: weeks
  - name: OIL_VOLATILE
    variable: WTI
    condition: "abs_weekly_pct_gte"
    value: 5.0
    periods: 4
    period_unit: weeks

vix_bypass:
  combos: [B]
  ssi_confirmed_combo_f: false
  docstring: |
    CRITICAL RULE: VIX_REGIME_BYPASS (Addendum A6)
    vix_bypass is set ONLY when runic_combo = 'B' is confirmed ACTIVE.
    Combo F + SSI confirmation does NOT set vix_bypass.

dominant:
  # Rohit sign-off 2026-08-06: B moved ABOVE C.
  # B and C can co-fire (an oil shock that cracks the market produces WTI +10% AND
  # VIX>25 AND HY>400bps AND CFTC<15th at the same time). Under the old C-first order
  # C's bearish call suppressed the capitulation buy at the exact bottom.
  PRIORITY:
    B: 100
    C: 90
    F: 80
    E: 70
    D: 60
    G: 50
    A: 40
  # General rule (same sign-off, not a C special case): any combo with fewer than
  # min_matured_episodes matured episodes ranks BELOW every validated combo,
  # regardless of its PRIORITY number. Episode counts come from the existing
  # combo_hit_rate_stats() / min_episodes_for_hit_rate() path, not a separate query.
  # Live counts 2026-08-17: A=174, B=274, C=3, D=455, E=508, F=704, G=n/a.
  low_n_demotion: true
  min_matured_episodes: 5
  combo_f_validation_date: "2020-06-08"

cpi:
  consensus_source: tradingeconomics.com  # primary; investing.com if INVESTING_HTTP_PROXY; CSV emergency only
  bls_series_id: CUSR0000SA0
  fred_fallback: CPIAUCSL
  fred_fallback_after_calendar_days: 2
  retry_times_et: ["08:30", "09:00", "10:00", "13:00", "16:00", "20:00"]
  hot_surprise_min_pp: 0.2
  not_hot_rule: "actual <= consensus"

ppi_cooling:
  bls_series_id: WPSFD49207
  enabled: true
  affects_combo_cancel: false
  cooling_mom_max_pct: 0.0

combo_c_cancel:
  wti_4wk_max_pct: 5.0
  consecutive_fridays: 4

source_freshness:
  # Re-scrape CAPE when source observation is more than N days before report as_of.
  cape_max_lag_days: 7
  # CFTC: stale when latest Tuesday position in series is older than expected_latest_cftc_tuesday(as_of).

cftc:
  # Official zips: scripts/download_cftc_tff_zip.py → macro_intelligence/data_cache/cftc/
  local_cache_dir: macro_intelligence/data_cache/cftc
  market_primary: "S&P 500 Consolidated"
  # Pre-Consolidated TFF line (2006-06 → 2010-06) — stitches before Consolidated for GFC-era backtests
  legacy_market_backfill: "S&P 500 STOCK INDEX"
  legacy_market_backfill_enabled: true
  market_filter: "S&P 500"
  market_exclude: "E-MINI|MICRO|DIVIDEND|ADJUSTED INT RATE"
  # Unit basis for the published FM/RM series (Rohit, 24 Aug 2026 -- "restate the whole series
  # in one unit"). CFTC redefined the "S&P 500 Consolidated" line on 2023-05-02:
  #   before: Consolidated = E-mini/5 + big  -> big-contract ($250) equivalents, micro excluded
  #   from:   Consolidated = E-mini + micro/10 -> E-mini ($50) equivalents, micro included
  # That is the 5.09x seam. "emini_equivalent" rebuilds the series from the component contract
  # lines at their notional weights instead, which is continuous by construction and needs no
  # stitch. "consolidated_line" restores the old behaviour (kept for regression tests).
  unit_basis: "emini_equivalent"
  # weight = contract notional / E-mini notional. Big S&P = $250 x index = 5 E-minis;
  # Micro = $5 x index = 1/10 E-mini. Dividend, total-return and adjusted-rate lines are
  # different products, not size variants, so they are deliberately absent.
  contract_weights:
    "E-MINI S&P 500 - CHICAGO MERCANTILE EXCHANGE": 1.0
    "E-MINI S&P 500 STOCK INDEX - CHICAGO MERCANTILE EXCHANGE": 1.0
    "S&P 500 STOCK INDEX - CHICAGO MERCANTILE EXCHANGE": 5.0
    "MICRO E-MINI S&P 500 INDEX - CHICAGO MERCANTILE EXCHANGE": 0.1
  # Standing seam test: flag any week where the series scales by more than this against the
  # trailing median level. A real redefinition moves every field at once by the same factor;
  # positioning does not. 2.5x is well above the largest genuine weekly move in 1054 weeks.
  unit_break_ratio: 2.5
  fm_classification: "Lev Money|Leveraged Funds"
  rm_classification: "Asset Mgr|Asset Manager"
  pending_status: PENDING_CFTC_CONFIRM
  pctile_window_weeks: 156
  # Placeholder display cuts per Rohit 13 Aug: "Ship placeholders with FM<10/SQUEEZE/No RM in
  # SQUEEZE, LIQUIDITY EXIT display >=80". Both legs are FM-only on purpose -- the RM leg is
  # dropped until the RM explanatory-power test says it earns its place. Unvalidated: these drive
  # a labelled display flag, nothing in sizing. Previous cuts were squeeze {FM<20, RM>45} and
  # liquidity_exit {RM<30, FM>60}. A missing key means the leg is not part of the rule.
  positioning_patterns:
    squeeze: { fm_pctile_max: 10 }
    liquidity_exit: { fm_pctile_min: 80 }
  pattern_templates:
    squeeze: "Fast money very short; real money less short"
    liquidity_exit: "Real money exiting; fast money still crowded long"
    none: ""

regime:
  min_regime_days_for_pctile: 50
  geo_model: claude-sonnet-4-5-20250929
  tavily_max_results: 5
  fed_funds_series: DFF
  fed_funds_start: "1990-01-01"
  fed_direction_weeks: 13
  fed_direction_weeks_short: 4
  fed_hike_3m_thresh: 0.25
  fed_cut_3m_thresh: -0.25
  cycle_early_months: 6
  qe_walcl_mom_min: 1.0
  qt_walcl_mom_max: -0.5

combo_hit_rates:
  A:
    direction: bullish
    primary_horizon: spx_6m
    secondary_horizon: spx_3m
    show_hit_rate: true
  B:
    direction: bullish
    primary_horizon: spx_3m
    show_hit_rate: true
  C:
    direction: bearish
    primary_horizon: spx_6m
    secondary_horizon: spx_3m
    show_hit_rate: true
    min_episodes_for_hit_rate: 5
  D:
    direction: bearish
    primary_horizon: spx_1w
    secondary_horizon: spx_2w
    show_hit_rate: true
    # D5 recalibrated gates (D_v1.18_c95_x13_l2); min_episodes=9 per Divyanshu 2026-07-21 (QE n=9)
    fed_cycle_slices:
      min_episodes: 9
      regimes: [CUTTING_LATE, HIKING_LATE, QE]
      validated_source: D5_fed_cycle_reslice
      validated_config_id: D_v1.18_c95_x13_l2
      validated:
        CUTTING_LATE:
          spx_1w: {n: 13, hit_rate: 0.9231, avg_return: -1.5923}
          spx_2w: {n: 13, hit_rate: 0.6923, avg_return: -0.6773}
        HIKING_LATE:
          spx_1w: {n: 24, hit_rate: 0.4167, avg_return: -0.0516}
          spx_2w: {n: 24, hit_rate: 0.3333, avg_return: -0.0861}
        QE:
          spx_1w: {n: 9, hit_rate: 0.4444, avg_return: 0.649}
          spx_2w: {n: 9, hit_rate: 0.3333, avg_return: 0.536}
  E:
    direction: bearish
    primary_horizon: spx_12m
    secondary_horizon: spx_6m
    show_hit_rate: true
  F:
    direction: bullish
    primary_horizon: spx_6m
    secondary_horizon: spx_3m
    show_hit_rate: true
  G:
    direction: null
    show_hit_rate: false

briefing:
  output_dir: macro_intelligence/output
  formats: [html, pdf]
  combo_labels:
    A: "Liquidity"
    B: "Capitulation"
    C: "Stagflation / Energy Shock"
    D: "FOMO Top"
    E: "Valuation Extreme"
    F: "Recovery"
    G: "Hidden Stress"
  combo_direction:
    A: "BEARISH"
    B: "BULLISH"
    C: "BEARISH"
    D: "BEARISH"
    E: "BEARISH"
    F: "BULLISH"
    G: "BEARISH"
  combo_max_weeks:
    C: 16
    F: 26
    D: 10

scheduled_events:
  types: [CPI, FOMC, NFP]
  pre_event_window_days: 7
  post_event_window_hours: 48
  near_threshold_pctile: [60, 79]
  near_threshold_low_pctile: [21, 40]
  fragility_min_vars: 4
  liquidity_shock:
    vix_points: 5
    hy_bps: 30
    usd_strength_pct: 0.5
  fred_release_ids:
    CPI: 10
    # FOMC removed 2026-08-20: release 19 was H.3 Aggregate Reserves (wrong calendar) and
    # release 101 returns publication timestamps, not meeting dates. FOMC comes from the
    # investing.com scraper into pending_releases instead.
    NFP: 50
  event_times_et:
    CPI: "08:30"
    NFP: "08:30"
    FOMC: "14:00"

aws:
  host: "51.20.53.218"
  tz: America/New_York
  friday_pull_et: "17:30"
  nightly_et: "18:00"
  ssi_daily_et: "08:00"
