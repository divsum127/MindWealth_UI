# Runic Agent v2.2 — Macro Intelligence Agent configuration
version: "2.2"

claude:
  model: "claude-sonnet-4-20250514"  # fallback; spec prefers claude-sonnet-4-6 when available
  regime_max_tokens: 150
  narrative_max_tokens: 1200

schedules:
  friday_pull_cron: "0 18 * * 5"   # Friday 6pm UTC (~after CFTC 3:30pm ET)
  nightly_cron: "0 21 * * 1-5"     # Mon-Fri 21:00 ET — set TZ on host
  monthly_review_cron: "0 10 1 * *"  # first day of month

prefilter:
  min_historical_fires: 3
  min_hit_rate: 0.60
  candidate_named_min_fires: 3
  candidate_named_min_hit_rate: 0.75

combo_discovery:
  primary_horizon: spx_3m
  surface_min_fires: 3
  surface_min_hit_rate: 0.60
  promotion_min_fires: 5
  promotion_min_hit_rate: 0.80
  beta_min_hit_rate: 0.55
  beta_min_hit_rate_alt: 0.60
  directionality_min_dims: 2
  directionality_min_hit_rate: 0.50
  hostile_fed_cycles: [HIKING_EARLY, HIKING_LATE, TIGHTENING]
  hostile_curve_regimes: [INVERTED]

forward_returns:
  spx_ticker: "^GSPC"
  horizons_trading_days: [5, 21, 63, 126]

variables:
  - id: NFCI
    name: "Financial Conditions (NFCI)"
    source: "FRED"
    ticker: "NFCI"
    paradigm: DUAL
    pctile_window: full
    pctile_start: "1973-01-01"
    combos: [A, E]
    rare:
      high_pctile: 80
      low_pctile: 20
      high_sd: 0.3
      low_sd: -0.3
    extreme:
      high_pctile: 95
      low_pctile: 5
      high_sd: 0.8
      low_sd: -0.8
  - id: HY
    name: "HY Credit Spreads OAS"
    source: "FRED"
    ticker: "BAMLH0A0HYM2"
    paradigm: DUAL
    pctile_window: full
    pctile_start: "1996-01-01"
    combos: [A, B, F, G]
    rare:
      abs_bps: 400
      high_pctile: 80
    extreme:
      abs_bps: 500
      high_pctile: 95
  - id: WALCL
    name: "Fed Balance Sheet MoM"
    source: "FRED"
    ticker: "WALCL"
    paradigm: ROC
    pctile_window: full
    pctile_start: "2008-01-01"
    combos: [A, C]
    rare:
      mom_pct: 0.8
    extreme:
      mom_pct: 2.0
  - id: CNH
    name: "USD/CNH 4wk change"
    source: "YAHOO"
    ticker: "USDCNH=X"
    fallback: "FRED:DEXCHUS"
    paradigm: ROC
    pctile_window: rolling_3y
    pctile_start: "2010-01-01"
    combos: [A, C, G]
    rare:
      pct_4wk: 1.5
    extreme:
      pct_4wk: 3.5
  - id: WTI
    name: "WTI Oil 4wk change"
    source: "YAHOO"
    ticker: "CL=F"
    paradigm: ROC
    pctile_window: rolling_3y
    combos: [C]
    rare:
      pct_4wk: 6.0
    extreme:
      pct_4wk: 10.0
  - id: VIX
    name: "VIX Level"
    source: "YAHOO"
    ticker: "^VIX"
    paradigm: DUAL
    pctile_window: full
    pctile_start: "1990-01-01"
    combos: [B, D, G]
    rare:
      abs_level: 25
      high_pctile: 80
    extreme:
      abs_level: 35
      high_pctile: 95
  - id: VXTS
    name: "VIX Term Structure"
    source: "YAHOO"
    ticker_ratio: ["^VIX3M", "^VIX"]
    paradigm: RATIO
    pctile_window: full
    pctile_start: "2007-01-01"
    combos: [D, G]
    rare:
      low_ratio: 0.95
      high_ratio: 1.10
    extreme:
      low_ratio: 0.85
      high_ratio: 1.20
  - id: CFTC
    name: "CFTC Net Spec (Fast Money)"
    source: "CFTC"
    paradigm: PCTILE
    pctile_window: rolling_3y
    pctile_start: "2006-01-01"
    combos: [B, D, E, F]
    rare:
      low_pctile: 15
      high_pctile: 85
    extreme:
      low_pctile: 5
      high_pctile: 95
  - id: CURVE
    name: "10Y-2Y Yield Curve"
    source: "FRED"
    ticker: "T10Y2Y"
    paradigm: DUAL
    pctile_window: full
    pctile_start: "1976-01-01"
    combos: [A, E]
    rare:
      spread_bps: -30
      steepen_4wk_bps: 15
    extreme:
      spread_bps: -80
      steepen_4wk_bps: 40
  - id: CPI
    name: "CPI Surprise"
    source: "CPI"
    paradigm: ABS
    pctile_window: rolling_3y
    combos: [C]
    rare:
      surprise_pp: 0.2
    extreme:
      surprise_pp: 0.4
  - id: GSR
    name: "Gold/Silver Ratio 4wk change"
    source: "YAHOO"
    ticker_ratio: ["GC=F", "SI=F"]
    paradigm: ROC
    pctile_window: rolling_3y
    combos: [A]
    rare:
      pct_4wk: 5.0
    extreme:
      pct_4wk: 8.0
  - id: CAPE
    name: "CAPE / Shiller P/E"
    source: "CAPE"
    paradigm: ABS
    pctile_window: full
    pctile_start: "1881-01-01"
    combos: [E]
    rare:
      high_level: 28
      low_level: 16
    extreme:
      high_level: 32
      low_level: 12

named_combos:
  A:
    min_of_four: 2
    vars: [NFCI, HY, WALCL, CNH]
  B:
    all_required: [VIX, HY, CFTC]
    vix_min: 25
    hy_bps_min: 400
    cftc_max_pctile: 15
  C:
    wti_4wk_min: 10.0
    cpi_surprise_min: 0.2
    walcl_flat: true
  D:
    vxts_min: 1.10
    cftc_min_pctile: 85
    vix_max: 18
  E:
    min_of_three: 2
    cape_min: 28
    nfci_easy_max: -0.3
    cftc_min_pctile: 80
  F:
    spx_50wma_reclaim_weekly_pct: 3.0
    cftc_max_pctile: 50
    active_weeks: 26
  G:
    vxts_max: 1.0
    hy_widen_4wk_bps: 30
    vix_max: 20

persistence_rules:
  - name: 7WK_GRIND
    variable: SPX
    condition: "weekly_return_gt"
    value: 0.5
    periods: 7
    period_unit: weeks
  - name: 3WK_SURGE
    variable: SPX
    condition: "weekly_return_gte"
    value: 3.0
    periods: 3
    period_unit: weeks
  - name: VIX_SUPPRESSED
    variable: VIX
    condition: "below"
    value: 15
    periods: 10
    period_unit: trading_days
  - name: HY_GRIND_TIGHT
    variable: HY
    condition: "tightening_4wk"
    periods: 8
    period_unit: weeks
  - name: FCI_EASING_STREAK
    variable: NFCI
    condition: "improving"
    periods: 6
    period_unit: weeks
  - name: OIL_VOLATILE
    variable: WTI
    condition: "abs_weekly_pct_gte"
    value: 5.0
    periods: 4
    period_unit: weeks

vix_bypass:
  combos: [B]
  ssi_confirmed_combo_f: true
  docstring: |
    CRITICAL RULE: VIX_REGIME_BYPASS
    When runic_combo = 'B' (Maximum Capitulation) is confirmed active,
    the VIX regime size multiplier is BYPASSED.

dominant:
  PRIORITY:
    C: 100
    B: 90
    F: 80
    E: 70
    D: 60
    G: 50
    A: 40
  combo_f_validation_date: "2020-06-08"

cpi:
  consensus_source: tradingeconomics.com  # primary; investing.com if INVESTING_HTTP_PROXY; CSV emergency only
  bls_series_id: CUSR0000SA0
  fred_fallback: CPIAUCSL
  fred_fallback_after_calendar_days: 2
  retry_times_et: ["08:30", "09:00", "10:00", "13:00", "16:00", "20:00"]
  hot_surprise_min_pp: 0.2
  not_hot_rule: "actual <= consensus"

ppi_cooling:
  bls_series_id: WPSFD49207
  enabled: true
  affects_combo_cancel: false
  cooling_mom_max_pct: 0.0

combo_c_cancel:
  wti_4wk_max_pct: 5.0
  consecutive_fridays: 4

cftc:
  # Official zips: scripts/download_cftc_tff_zip.py → macro_intelligence/data_cache/cftc/
  local_cache_dir: macro_intelligence/data_cache/cftc
  market_primary: "S&P 500 Consolidated"
  market_filter: "S&P 500"
  market_exclude: "E-MINI|MICRO|DIVIDEND|ADJUSTED INT RATE"
  fm_classification: "Lev Money|Leveraged Funds"
  rm_classification: "Asset Mgr|Asset Manager"
  pending_status: PENDING_CFTC_CONFIRM
  pctile_window_weeks: 156

regime:
  min_regime_days_for_pctile: 50
  geo_model: claude-sonnet-4-20250514
  tavily_max_results: 5
  fed_funds_series: DFF
  fed_funds_start: "1990-01-01"
  fed_direction_weeks: 13
  fed_direction_weeks_short: 4
  fed_hike_3m_thresh: 0.25
  fed_cut_3m_thresh: -0.25
  cycle_early_months: 6
  qe_walcl_mom_min: 1.0
  qt_walcl_mom_max: -0.5

combo_hit_rates:
  A:
    direction: bullish
    primary_horizon: spx_6m
    secondary_horizon: spx_3m
    show_hit_rate: true
  B:
    direction: bullish
    primary_horizon: spx_3m
    show_hit_rate: true
  C:
    direction: bearish
    primary_horizon: spx_6m
    secondary_horizon: spx_3m
    show_hit_rate: true
  D:
    direction: bearish
    primary_horizon: spx_1w
    show_hit_rate: true
  E:
    direction: bearish
    primary_horizon: spx_12m
    show_hit_rate: true
  F:
    direction: bullish
    primary_horizon: spx_6m
    secondary_horizon: spx_3m
    show_hit_rate: true
  G:
    direction: null
    show_hit_rate: false

briefing:
  output_dir: macro_intelligence/output
  formats: [html, pdf]
  combo_labels:
    A: "Liquidity"
    B: "Capitulation"
    C: "Stagflation / Energy Shock"
    D: "FOMO Top"
    E: "Valuation Extreme"
    F: "Recovery"
    G: "Hidden Stress"
  combo_direction:
    A: "BEARISH"
    B: "BULLISH"
    C: "BEARISH"
    D: "BEARISH"
    E: "BEARISH"
    F: "BULLISH"
    G: "BEARISH"
  combo_max_weeks:
    C: 16
    F: 26
    D: 10

aws:
  host: "51.20.53.218"
  tz: America/New_York
  friday_pull_et: "17:30"
  nightly_et: "18:00"
  ssi_daily_et: "08:00"
