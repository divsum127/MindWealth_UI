version: "1.0"

schedules:
  daily_cron: "0 8 * * 1-5"  # 08:00 UTC Mon-Fri (host cron; ~04:00 ET)

paths:
  ssi_data_dir: "macro_intelligence/data/ssi"
  analysis_dir: "macro_intelligence/analysis/ssi_validation"

tickers:
  hyg: "HYG"
  lqd: "LQD"
  dbmf: "DBMF"
  spy: "SPY"
  vix: "^VIX"
  vix3m: "^VIX3M"

staleness:
  # Calendar days a carried-forward print remains eligible; beyond max → dropped.
  max_stale_days:
    weekly: 5
    daily: 1
    monthly: 25
  # Multiplier on nominal weight when stale_days > 0 (residual redistributed).
  weight_penalty: 0.8

ssi_score:
  history_years: 5
  design_percentile: 20  # ~20th percentile of 5y distribution by design intent
  zscore_clip: 3.0
  layer_weights:
    layer1: 0.40
    layer2: 0.35
    layer3: 0.25
  # Within-layer weights for Layer 1 composite (renormalized when a signal is missing).
  layer1_input_weights:
    aaii_spread: 0.30
    naaim_exposure: 0.35
    put_call_ema: 0.20
    cnn_fg: 0.15
  layers:
    layer1:
      - aaii_spread
      - naaim_exposure
      - put_call_ema
      - cnn_fg
    layer2:
      - mcclellan
      - nh_nl_ratio
      - hyg_lqd
      - skew
      - vix_ratio
      - pct_above_200dma
    layer3:
      - dbmf_beta
      - cftc_fm_net
      - cftc_rm_net
      - gross_net
  # Legacy 4-input weights (Layer 2 confirmation votes only — not composite)
  legacy_composite_weights:
    hyg_lqd: 0.30
    dbmf_beta: 0.25
    cnn_fg: 0.25
    vix_ratio: 0.20

layer2:
  min_confirmed: 2
  gate_z_min: 0.5  # |z| on layer2 component norm → gate confirms (mcclellan, nh_nl, skew, %200dma)
  multipliers:
    CONFIRMED: 1.20
    PARTIAL: 1.00
    UNCONFIRMED: 0.80
  votes:
    hyg_lqd:
      risk_on_pctile_min: 70
      risk_off_pctile_max: 30
    dbmf_beta:
      low_beta_max: 0.5
      high_beta_min: 1.2
    cnn_fg:
      fear_max: 25
      greed_min: 75
    vix_ratio:
      stress_min: 1.05
      complacency_max: 0.95

thresholds:
  long_entry: -0.6
  short_entry: 0.85
  long_entry_pctile: 20
  short_entry_pctile: 85
  long_sweep_start: -0.3
  long_sweep_end: -0.9
  long_sweep_step: 0.1
  short_sweep_values: [0.6, 0.7, 0.8, 0.85, 0.9]

forward_returns:
  spx_ticker: "^GSPC"
  horizons_trading_days: [5, 21, 63, 126]
